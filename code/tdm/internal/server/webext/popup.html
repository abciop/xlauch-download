<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 340px; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: #222; background: #f7f8fa; }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; background: linear-gradient(135deg, #4f7cff, #6a5cff); color: #fff;
  }
  header img { width: 22px; height: 22px; border-radius: 4px; }
  header b { font-size: 13.5px; }
  header .dot { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.2); }
  header .dot.ok { background: #2ecc71; }
  header .dot.no { background: #e74c3c; }
  section { padding: 10px 14px; border-bottom: 1px solid #e8eaf0; }
  h3 { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 600; }
  button {
    font: inherit; cursor: pointer; border: 1px solid #d5d9e2; background: #fff;
    border-radius: 7px; padding: 6px 10px; color: #333;
  }
  button:hover { border-color: #4f7cff; color: #4f7cff; }
  button.primary { background: linear-gradient(135deg, #4f7cff, #6a5cff); color: #fff; border: none; }
  .row { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .res {
    display: block; width: 100%; text-align: left; padding: 7px 9px; margin-bottom: 5px;
    background: #fff; border: 1px solid #e3e6ee; border-radius: 7px; color: #333;
  }
  .res:hover { border-color: #4f7cff; }
  .res .n { display: block; font-weight: 600; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .u { font-size: 11px; color: #888; word-break: break-all; display: block; margin-top: 2px; }
  .res .t { font-size: 11px; color: #4f7cff; display: block; margin-top: 2px; }
  .empty { color: #999; font-size: 11.5px; padding: 4px 0; }
  .note { font-size: 11px; color: #e67e22; line-height: 1.6; margin-top: 6px; }
  .status { font-size: 11.5px; color: #666; margin-top: 4px; }
  .status.ok { color: #27ae60; }
  .status.err { color: #e74c3c; }
  .port-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .port-row input {
    width: 70px; font: inherit; padding: 4px 6px; border: 1px solid #d5d9e2; border-radius: 6px;
  }
  .port-row span { font-size: 11px; color: #888; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="XDM">
  <b>XDM 下载器助手</b>
  <span class="dot" id="dot">检测中</span>
</header>

<section>
  <h3>当前页面</h3>
  <div class="row">
    <button class="primary" id="btn-page">下载当前页面 URL</button>
    <button id="btn-export">导出登录 Cookie</button>
  </div>
  <div class="status" id="export-status">导出后 XDM 下载该站点视频将自动携带登录态</div>
</section>

<section>
  <h3>本页嗅探到的媒体资源</h3>
  <div id="res-list"><div class="empty">暂未嗅探到资源（播放视频后重新打开本弹窗）</div></div>
</section>

<section>
  <h3>连接设置</h3>
  <div class="port-row">
    <input type="number" id="port" min="1" max="65535" value="50710">
    <span>XDM 监听端口</span>
    <button id="btn-port">保存</button>
  </div>
</section>

<script src="popup.js"></script>
</body>
</html>
